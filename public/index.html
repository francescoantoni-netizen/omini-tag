<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Acchiapparella</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Font "sala giochi anni 80": un font a blocchetti/pixel, usato per
       tutte le scritte del gioco. Viene da Google Fonts (gratis, nessuna
       registrazione), quindi qui carichiamo solo un riferimento a un file
       che sta sui loro server, non un file nostro. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />

  <!-- Questi permettono di "installare" il gioco sulla schermata Home del
       telefono: aperto da lì (non da un link/segnalibro) il browser non
       mostra più barra degli indirizzi né altri controlli — l'unico modo
       vero per avere l'impressione di un'app invece che di una pagina web,
       cosa che una pagina normale non può fare da sola per motivi di
       sicurezza (altrimenti qualunque sito potrebbe fingersi un'altra app). -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#14161b" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Acchiapparella" />
</head>
<body>
  <div id="join-screen">
    <h1>🏃 Acchiapparella</h1>
    <p>Un cacciatore insegue, tutti gli altri scappano. 45 secondi a round.</p>
    <form id="join-form">
      <input id="name-input" type="text" placeholder="Il tuo nome" maxlength="16" required />
      <button type="submit">Entra in partita</button>
    </form>
  </div>

  <div id="game-screen" hidden>
    <div id="hud">
      <span id="players-label"></span>
    </div>
    <canvas id="arena" width="800" height="600"></canvas>
    <div id="banner"></div>

    <!-- Il conto alla rovescia (3-2-1 prima del via, poi i secondi del
         round) è un elemento a parte, grosso — non dentro l'HUD — così
         può stare "galleggiante" sopra il joystick sul telefono, come
         chiesto. -->
    <div id="big-countdown"></div>
    <p class="hint">Muoviti con le frecce, WASD, oppure spingi il TrackPoint mentre il cursore è sopra l'arena</p>

    <!-- Joystick e avviso di rotazione stanno DENTRO #game-screen apposta:
         così, finché sei sulla schermata "inserisci il nome", ereditano
         l'attributo "hidden" del genitore e restano invisibili — niente
         joystick sopra il campo del nome prima ancora di essere entrati
         in partita. -->
    <div id="joystick">
      <div id="joystick-knob"></div>
    </div>

    <div id="rotate-hint">
      <p>📱 Ruota il telefono in orizzontale per giocare meglio</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
